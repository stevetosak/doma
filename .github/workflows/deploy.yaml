name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: ['main']

env:
  IMAGE_VERSION_PATTERN: 'alpha-${{ github.sha }}'
  DOCKERHUB_NAMESPACE: 'stevetosak'

jobs:
  # doma's own gate — there's no shared e2e workflow here (unlike Authos),
  # so typecheck/lint/test stand in as the thing nothing ships without.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check
      - run: npm run test

  build-push:
    needs: check
    runs-on: ubuntu-22.04
    outputs:
      IMAGE_LATEST: ${{ steps.image_tags.outputs.IMAGE_LATEST }}
      IMAGE_VERSION: ${{ steps.image_tags.outputs.IMAGE_VERSION }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version string
        id: ver
        run: |
          APP_VERSION=$(git describe --tags --always --match 'v[0-9]*')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved APP_VERSION=$APP_VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Set image tags
        id: image_tags
        run: |
          IMAGE_LATEST="${{ env.DOCKERHUB_NAMESPACE }}/doma:latest"
          IMAGE_VERSION="${{ env.DOCKERHUB_NAMESPACE }}/doma:${{ env.IMAGE_VERSION_PATTERN }}"
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_OUTPUT
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.APP_VERSION }}
          tags: |
            ${{ steps.image_tags.outputs.IMAGE_LATEST }}
            ${{ steps.image_tags.outputs.IMAGE_VERSION }}

  # The tag bump goes to the infra repo as a pull request that only its
  # required check `deploy-scope` can let merge (infra ADR 0010, Amendment
  # 2026-10-22). One group per Application, so two bumps never race.
  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    concurrency:
      group: tag-bump-doma-web
      cancel-in-progress: false
    steps:
      - uses: stevetosak/hetzner-cloud-infra/.github/actions/tag-bump@master
        with:
          private-key: ${{ secrets.TAG_BUMP_APP_KEY }}
          overlay-dir: projects/doma/web/manifests/overlays/dev
          image: stevetosak/doma
          tag: ${{ env.IMAGE_VERSION_PATTERN }}
